

<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <script>
        function premierExo() {

            let e = "hello";

            let g = { a : 0.4 };

<body onload="premierExo();">
    <div >

    <div>
        <h1 onclick="deuxiemeExo();">Deuxième Exercice : asisstant médical simple</h1>
        <p id="returns2"></p>
        <script>
            function deuxiemeExo() {
                let possibilities = ["tete", "ventre", "dos"];
                alert("Bonjour, je suis votre assistant médical.");
                let localisation = prompt("Où avez-vous mal ?").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").split(" ")[0];
                
                while (!possibilities.includes(localisation)) {
                    alert("Je ne connais pas ce type de douleur.");
                    localisation = prompt("Je n'ai pas compris.. Où avez-vous mal ?").toLowerCase();
                }
                if (localisation === "tête"|| localisation === "tete") {
                    alert("Vous avez mal à la tête, prenez un Doliprane.");
                } else if (localisation === "ventre") {
                    alert("Vous avez mal au ventre, prenez un Spasfon.");
                } else {
                    alert("Vous avez mal au dos, reposez-vous.");
                };
                ;
            }
            document.getElementById("returns2").innerHTML = "Cliquez sur le titre pour lancer l'exercice."
        </script>
    </div>
    <div>
        <h1 onclick="troisiemeExo();">Troisième Exercice : ascenssion développeur</h1>
        <p id="returns3"></p>
        <script>

            function mission(language) {

                let mission = prompt("Il faut vous améliorer en " + language +" \n Acceptez-vous le défis ?").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                if (mission === "oui" || mission === "yes") {
                    alert("Super, vous irez loin !");
                } else if (mission === "non" || mission === "no") {
                    alert("Dommage, vous aviez du potentiel !");
                } else {
                    alert("Je n'ai pas compris votre réponse.");
                    mission(language);
                }
                alert("Parfait, vous irez loin !");
            }
            function troisiemeExo() {
                alert("Bienvenue, je vais tester votre niveau en programmation !");
                let HTML = prompt("A combien, en pourcentage, évaluez-vous votre niveau de compétence en HTML ?").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f, %]/g, "");
                let CSS = prompt("A combien, en pourcentage, évaluez-vous votre niveau de compétence en CSS ?").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f, %]/g, "");
                let JS = prompt("A combien, en pourcentage, évaluez-vous votre niveau de compétence en JavaScript ?").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f, %]/g, "");
                let PHP = prompt("Pour finir, à combien, en pourcentage, évaluez-vous votre niveau de compétence en PHP ?").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f, %]/g, "");
                let total = (parseInt(HTML) + parseInt(CSS) + parseInt(JS) + parseInt(PHP)) / 4;
            
                if (HTML < 50) {
                    if (total > 12.5) {
                        alert("Vous avez un niveau débutant en programmation. \n Je vous recommende de ne pas vous éparpiller, et de vous concentrer sur un langage à la fois, le HTML d'abord.");
                        mission("HTML");
                    } else {
                        alert("Vous êtes débutant en programmation, mais vous arrivez à ne pas vous éparpiller. \n Une fois votre niveau amélioré en HTML, je vous recommande de continuer à vous concentrer sur le CSS");
                    }
                }
                if (HTML >= 50 && HTML < 75) {
                    if (CSS < 50) {
                        alert("Vous avez un niveau intermédiaire en HTML, mais vous êtes débutant en CSS. \n Je vous recommande de vous concentrer sur le CSS pour améliorer votre niveau.");
                        mission("CSS");
                    } else {
                        alert("Vous avez un niveau intermédiaire en HTML et CSS, mais vous êtes débutant en JavaScript. \n Je vous recommande de vous former sur une base de JavaScript pour améliorer votre niveau.");
                        mission("JavaScript");
                    }
                }
                if (HTML >= 75 && HTML < 80) {
                    if (CSS < 75 ) {
                        alert("Vous avez un niveau avancé en HTML, mais vous n'avez pas le niveau en CSS. \n Je vous recommande de vous concentrer sur le CSS pour améliorer votre niveau.");
                        mission("CSS");
                    } else if (JS < 75) {
                        alert("Vous avez un niveau avancé en HTML et CSS, mais vous n'avez pas le niveau en JavaScript. \n Je vous recommande de vous améliorer en JavaScript pour améliorer votre niveau.");
                        mission("JavaScript");
                    } else if (PHP < 75) {
                        alert("Vous avez un niveau avancé en HTML, CSS et JavaScript, mais vous avez un niveau plus faible en PHP. \n Je vous recommande de vous focaliser un peu sur PHP pour améliorer votre niveau.");
                        mission("PHP");
                    } else {
                        alert("Vous avez déjà un super niveau avancé en HTML, CSS, JS, et PHP. \n Je vous recommande de faire le point sur vos faiblesses restantes et devenir le roi du développement web.");
                    }
                }
                if (HTML >= 80 && total > 76.25) {
                    alert("Vous avez un niveau expert en programmation !" );
                    mission("Procrastination");
                }
            }
            document.getElementById("returns3").innerHTML = "Cliquez sur le titre pour lancer l'exercice."
        </script>
    </div>
    <div>
        <h1 onclick="FizzBuzz();">Exercice 4A : FizzBuzz Base</h1>
        <p id="return4"></p>
        <script>
            function FizzBuzz() {
                for (let i = 1; i < 200; i++) {
                    if (i % 3 === 0 && i % 5 === 0) {
                        document.getElementById("return4").innerHTML += "FizzBuzz<br>" ;
                    } else if (i % 3 === 0) {
                        document.getElementById("return4").innerHTML += "Fizz<br>";
                    } else if (i % 5 === 0) {
                        document.getElementById("return4").innerHTML += "Buzz<br>";
                    } else {
                        document.getElementById("return4").innerHTML += i +"<br>";
                    }
                }
            }
        </script>
        <h1 onclick="FizzBuzzTernary();"> Exercice 4B : FizzBuzz Ternaire</h1>
        <p id="return5"></p>
        <script>
            function FizzBuzzTernary() { for (let i = 1 ; i < 200; i++) document.getElementById("return5").innerHTML += (i % 15 === 0) ? "FizzBuzz<br>" : (i % 3 === 0) ? "Fizz<br>" : (i % 5 === 0) ? "Buzz<br>" : i + "<br>"; }
        </script>
    </div>
    <div>
        <h1 onclick="calculetteBasique();">Calculette Simple</h1>
        <p id="return6"></p>
        <script>
            function calculetteBasique() {
                let Choix = prompt("Choisissez une opération : \n 1. Addition entre deux nombres \n 2. Multiplication par deux \n 3.Diviser par deux \n 4. Obtenir le signe d'un nombre \n 5. Factorielle d'un nombre");
                if (Choix === "1") { let x = parseFloat(prompt("Entrez le premier nombre : ")) + let y = parseFloat(prompt("Entrez le second nombre : ")); document.getElementById("return6").innerHTML = "l'addition de " + x + " avec " + y + "donne la somme de : " + addition(x,y)} else if (choix===2) { let x = parseFloat(prompt("Entrez le nombre :")); document.getElementById("return6").innerHTML += "Le résultat de la multiplication par deux est : " + multiplication(x) + "<br>"; } else if (Choix === "3") { let x = parseFloat(prompt("Entrez le nombre :")); document.getElementById("return6").innerHTML += "Le résultat de la division par deux est : " + diviser(x) + "<br>"; } else if (Choix === "4") { let x = parseFloat(prompt("Entrez le nombre :")); document.getElementById("return6").innerHTML += "Le signe du nombre est : " + signe(x) + "<br>"; } else if (Choix === "5") { let x = parseInt(prompt("Entrez le nombre :")); document.getElementById("return6").innerHTML += "La factorielle de " + x + " est : " + factorielle(x) + "<br>"; } else { alert("Choix invalide, veuillez réessayer."); calculetteBasique(); }            
            }

            function addition(x, y) {
                return x + y;
            }
            function multiplication(x) {
                return x * 2;
            }
            function diviser(x) {
                return x / 2;
            }
            function signe(x) {
                return x >= 0 ? "Positif" : "Négatif";
            }
            function factorielle(x) {
                if (x < 0) return "Indéfini";
                if (x === 0 || x === 1) return 1;
                let result = 1;
                for (let i = 2; i <= x; i++) {
                    result *= i;
                }
                return result;
            }
            // Diviser/2, sommeA+B, SigneA, factorielleA
        </script>
    </div>
</body>
