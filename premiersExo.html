        <h1 onclick="FizzBuzz();">Exercice 4A : FizzBuzz Base</h1>
        <p id="return4"></p>
        <script>
            function FizzBuzz() {
                for (let i = 1; i < 200; i++) {
                    if (i % 3 === 0 && i % 5 === 0) {
                        document.getElementById("return4").innerHTML += "FizzBuzz<br>" ;
                    } else if (i % 3 === 0) {
                        document.getElementById("return4").innerHTML += "Fizz<br>";
                    } else if (i % 5 === 0) {
                        document.getElementById("return4").innerHTML += "Buzz<br>";
                    } else {
                        document.getElementById("return4").innerHTML += i +"<br>";
                    }
                }
            }
        </script>
        <h1 onclick="FizzBuzzTernary();"> Exercice 4B : FizzBuzz Ternaire</h1>
        <p id="return5"></p>
        <script>
            function FizzBuzzTernary() { for (let i = 1 ; i < 200; i++) document.getElementById("return5").innerHTML += (i % 15 === 0) ? "FizzBuzz<br>" : (i % 3 === 0) ? "Fizz<br>" : (i % 5 === 0) ? "Buzz<br>" : i + "<br>"; }
        </script>

            function addition(x, y) {
                return x + y;
            }
            function multiplication(x) {
                return x * 2;
            }
            function diviser(x) {
                return x / 2;
            }
            function signe(x) {
                return x >= 0 ? "Positif" : "Négatif";
            }
            function factorielle(x) {
                if (x < 0) return "Indéfini";
                if (x === 0 || x === 1) return 1;
                let result = 1;
                for (let i = 2; i <= x; i++) {
                    result *= i;
                }
                return result;
            }
            
            function calculetteBasique() {
                let Choix = prompt("Choisissez une opération : \n 1. Addition entre deux nombres \n 2. Multiplication par deux \n 3. Diviser par deux \n 4. Obtenir le signe d'un nombre \n 5. Factorielle d'un nombre");
                if (Choix === "1") { 
                    let x = parseFloat(prompt("Entrez le premier nombre : ")); 
                    let y = parseFloat(prompt("Entrez le second nombre : ")); 
                    document.getElementById("return6").innerHTML += "l'addition de " + x + " avec " + y + "donne la somme de : " + addition(x,y);
                } else if (Choix==="2") { let x = parseFloat(prompt("Entrez le nombre :")); 
                    document.getElementById("return6").innerHTML += "Le résultat de la multiplication par deux est : " + multiplication(x) + "<br>"; 
                } else if (Choix === "3") { 
                    let x = parseFloat(prompt("Entrez le nombre :")); 
                    document.getElementById("return6").innerHTML += "Le résultat de la division par deux est : " + diviser(x) + "<br>"; 
                } else if (Choix === "4") { 
                    let x = parseFloat(prompt("Entrez le nombre :")); 
                    document.getElementById("return6").innerHTML += "Le signe du nombre est : " + signe(x) + "<br>"; 
                } else if (Choix === "5") { 
                    let x = parseInt(prompt("Entrez le nombre :")); 
                    document.getElementById("return6").innerHTML += "La factorielle de " + x + " est : " + factorielle(x) + "<br>"; 
                } else {
                    alert("Choix invalide, veuillez réessayer."); calculetteBasique(); 
                }            
            }

    <div>
        <h2>Chi-Fou-Mi - 2 manches gagnantes</h2>
        <button onclick="jouer('pierre')">Pierre</button>
        <button onclick="jouer('feuille')">Feuille</button>
        <button onclick="jouer('ciseaux')">Ciseaux</button>

        <div id="return9"></div>
          <script>
            const choixPossibles = ["pierre", "feuille", "ciseaux"];
            let scoreUtilisateur = 0;
            let scoreOrdinateur = 0;
            let manches = 0;
            let partieTerminee = false;

            function jouer(choixUtilisateur) {
            if (partieTerminee) return;

            const choixOrdinateur = choixPossibles[Math.floor(Math.random() * 3)];
            let message = "Vous : <strong>${choixUtilisateur}</strong> | Ordinateur : <strong>${choixOrdinateur}</strong> → ";

            if (choixUtilisateur === choixOrdinateur) {
                message += "Égalité !<br>";
                document.getElementById("return9").innerHTML += message;
                return;
            }

            const utilisateurGagne =
                (choixUtilisateur === "pierre" && choixOrdinateur === "ciseaux") ||
                (choixUtilisateur === "feuille" && choixOrdinateur === "pierre") ||
                (choixUtilisateur === "ciseaux" && choixOrdinateur === "feuille");

            if (utilisateurGagne) {
                scoreUtilisateur++;
                manches++;
                message += "Vous gagnez ce tour !<br>";
            } else {
                scoreOrdinateur++;
                manches++;
                message += "L'ordinateur gagne ce tour !<br>";
            }

            document.getElementById("return9").innerHTML += message;

            if (scoreUtilisateur === 2 || scoreOrdinateur === 2 || manches === 3) {
                partieTerminee = true;
                afficherResultatFinal();
            }
            }

            function afficherResultatFinal() {
            let resultat = "<hr><strong>Résultat final : </strong>";
            if (scoreUtilisateur === 2) {
                resultat += "Vous avez gagné la partie !";
            } else if (scoreOrdinateur === 2) {
                resultat += "L'ordinateur a gagné la partie.";
            } else {
                resultat += "Match nul (trop d'égalités).";
            }
            document.getElementById("return9").innerHTML += resultat + "<br><br><button onclick='resetPartie()'>Rejouer</button>";
            }

            function resetPartie() {
            scoreUtilisateur = 0;
            scoreOrdinateur = 0;
            manches = 0;
            partieTerminee = false;
            document.getElementById("return9").innerHTML = "";
            }
        </script>
